# Netlify (Free plan) build settings. See docs/hosting-move.md.
#
# Netlify detects Next.js and runs it with its OpenNext adapter; no plugin
# entry is needed here (Netlify recommends not pinning the adapter).

[build]
  command = "npm run build"
  publish = ".next"
  # Free plan: 300 credits a month, 15 per production deploy, and the
  # whole site pauses when they run out. So pushes to main do NOT deploy
  # by themselves. scripts/netlify-ignore.sh says which builds go ahead.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
